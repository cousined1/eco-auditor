name: Fallow Codebase Intelligence

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Fallow
        uses: fallow-rs/fallow@v3.16.0

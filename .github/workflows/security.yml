name: Security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run build && npm test

      - name: Lint changed security surfaces
        run: npx eslint tests/server-security.test.ts tests/server-billing.test.ts tests/server-health.test.ts scripts/audit-production.mjs

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Scan checked-out files for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-git --redact --config /repo/.gitleaks.toml --exit-code 1

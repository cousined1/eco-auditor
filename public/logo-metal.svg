<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Modern flat eco logo — abstract leaf + cycle, no text -->
  <rect width="512" height="512" fill="#0d2818" rx="96"/>
  
  <!-- Abstract leaf shape — organic but geometric -->
  <path fill="#52b788" d="M256 96C256 96 176 176 176 280C176 352 208 400 256 432C304 400 336 352 336 280C336 176 256 96 256 96Z"/>
  <path fill="#0d2818" d="M256 140C256 140 208 200 208 280C208 330 228 370 256 392C284 370 304 330 304 280C304 200 256 140 256 140Z"/>
  
  <!-- Central vein — minimal line -->
  <line x1="256" y1="160" x2="256" y2="380" stroke="#95d5b2" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Abstract cycle/recycle arcs — not the trademarked recycling symbol -->
  <path fill="none" stroke="#2d6a4f" stroke-width="8" stroke-linecap="round" d="M120 360A200 200 0 0 1 392 360"/>
  <path fill="none" stroke="#2d6a4f" stroke-width="8" stroke-linecap="round" d="M392 360A200 200 0 0 1 120 360"/>
  
  <!-- Abstract arrow heads — geometric triangles -->
  <polygon points="100,350 120,330 120,370" fill="#52b788"/>
  <polygon points="412,350 392,330 392,370" fill="#52b788"/>
  
  <!-- Audit dot — minimal check node -->
  <circle cx="256" cy="460" r="12" fill="#95d5b2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- EcoAuditor v2 — Flat geometric mark: abstract leaf + cycle arrows + checkmark -->
  <!-- No text, no 3D, no gradients -->
  
  <!-- Bottom cycle arrow — teal/cyan (#06b6d4), sweeping counterclockwise -->
  <path fill="none" stroke="#06b6d4" stroke-width="24" stroke-linecap="round" d="M380 310 A150 150 0 0 0 132 310"/>
  <!-- Bottom arrowhead — teal -->
  <polygon points="115,295 132,270 148,298" fill="#06b6d4"/>
  
  <!-- Top cycle arrow — navy (#1e3a5f), sweeping clockwise -->
  <path fill="none" stroke="#1e3a5f" stroke-width="24" stroke-linecap="round" d="M132 202 A150 150 0 0 0 380 202"/>
  <!-- Top arrowhead — navy -->
  <polygon points="397,217 380,242 364,214" fill="#1e3a5f"/>
  
  <!-- Abstract leaf — geometric, formed from overlapping curves -->
  <!-- Left leaf half -->
  <path fill="#52b788" d="M256 120 C256 120 200 170 200 260 C200 310 225 350 256 380 C287 350 312 310 312 260 C312 170 256 120 256 120Z"/>
  <!-- Inner leaf cutout — creates the split-leaf effect -->
  <path fill="#ffffff" d="M256 160 C256 160 225 200 225 260 C225 300 240 330 256 350 C272 330 287 300 287 260 C287 200 256 160 256 160Z"/>
  
  <!-- Central vein line -->
  <line x1="256" y1="155" x2="256" y2="365" stroke="#2d6a4f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Checkmark badge circle — navy -->
  <circle cx="256" cy="430" r="28" fill="#1e3a5f"/>
  <!-- Checkmark — white -->
  <polyline points="242,430 252,440 270,420" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent dark-mode FOUC: apply persisted/system theme before first paint (key matches useTheme) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eco-theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* storage unavailable; default theme applies */ }
      })();
    </script>

    <!-- Primary SEO (homepage defaults; each route's values are written at build time) -->
    <title>Eco-Auditor — GHG Carbon Accounting for SMBs</title>
    <meta name="description" content="Carbon accounting for SMBs: import activity data by CSV, calculate Scope 1-3 emissions with EPA, eGRID and IPCC factors, and download a PDF summary." />
    <meta name="keywords" content="carbon accounting, GHG Protocol, Scope 1 2 3 emissions, SMB carbon footprint, emissions inventory" />
    <meta name="author" content="Developer312" />
    <meta name="robots" content="index, follow" />
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity canonical links do not load executable subresources -->
    <link rel="canonical" href="https://ecoauditor.io/" />

    <!-- Open Graph (LinkedIn, Facebook, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ecoauditor.io/" />
    <meta property="og:title" content="Eco-Auditor — GHG Carbon Accounting for SMBs" />
    <meta property="og:description" content="Carbon accounting for SMBs: import activity data by CSV, calculate Scope 1-3 emissions with EPA, eGRID and IPCC factors, and download a PDF summary." />
    <meta property="og:image" content="https://ecoauditor.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eco-Auditor — Carbon accounting as easy as bookkeeping. Scope 1-3 emissions data for SMBs." />
    <meta property="og:site_name" content="Eco-Auditor" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ecoauditor.io/" />
    <meta name="twitter:title" content="Eco-Auditor — GHG Carbon Accounting for SMBs" />
    <meta name="twitter:description" content="Carbon accounting for SMBs: import activity data by CSV, calculate Scope 1-3 emissions with EPA, eGRID and IPCC factors, and download a PDF summary." />
    <meta name="twitter:image" content="https://ecoauditor.io/og-image.png" />
    <meta name="twitter:image:alt" content="Eco-Auditor — Carbon accounting as easy as bookkeeping" />
    <meta name="twitter:site" content="@developer312" />

    <!-- PWA & theme -->
    <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14532d" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Eco-Auditor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Eco-Auditor" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts are self-hosted (see @font-face in src/index.css): nothing is requested from Google before a visitor has chosen anything (F-F-06).
         Preload the one face every page needs; `crossorigin` is required for fonts even on the same origin. -->
    <link rel="preload" href="/fonts/inter-v20-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- JSON-LD Structured Data (site-wide entities only; page-level entities are added per route at build time) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ecoauditor.io/#organization",
          "name": "Eco-Auditor",
          "url": "https://ecoauditor.io",
          "logo": "https://ecoauditor.io/favicon-512x512.png",
          "description": "Carbon accounting software for small and mid-size businesses",
          "parentOrganization": {
            "@type": "Organization",
            "name": "NIGHT LITE USA LLC"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+1-510-591-0163",
            "contactType": "sales",
            "email": "hello@developer312.com",
            "availableLanguage": "English"
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://ecoauditor.io/#website",
          "url": "https://ecoauditor.io",
          "name": "Eco-Auditor",
          "description": "GHG carbon accounting for SMBs",
          "publisher": {
            "@id": "https://ecoauditor.io/#organization"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://ecoauditor.io/#software",
          "name": "Eco-Auditor",
          "url": "https://ecoauditor.io",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "GHG emissions accounting for Scope 1, 2, and 3 from CSV activity data, with a PDF emissions summary. Built for SMBs answering customer and supply-chain emissions-data requests.",
          "offers": {
            "@type": "AggregateOffer",
            "lowPrice": "149",
            "highPrice": "999",
            "priceCurrency": "USD",
            "offerCount": "3"
          },
          "featureList": [
            "Scope 1, 2, 3 emissions tracking",
            "CSV activity data import",
            "PDF emissions summary reports",
            "GHG Protocol aligned methodology"
          ],
          "author": {
            "@id": "https://ecoauditor.io/#organization"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-white dark:bg-surface-950 text-surface-800 dark:text-surface-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

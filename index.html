<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent dark-mode FOUC: apply persisted/system theme before first paint (key matches useTheme) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eco-theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* storage unavailable; default theme applies */ }
      })();
    </script>

    <!-- Primary SEO -->
    <title>Eco-Auditor — GHG Carbon Accounting for SMBs</title>
    <meta name="description" content="Eco-Auditor gives small and mid-size businesses reviewable GHG emissions data. Import activity data by CSV, connect integrations (roadmap), and generate Scope 1-3 reports aligned with the GHG Protocol." />

    <meta name="author" content="Developer312" />
    <meta name="robots" content="index, follow" />

      - article [ref=e60]:
        - paragraph [ref=e62]: This page is provided as a business draft for review and should be reviewed by qualified legal counsel before publication.
        - heading "Privacy Policy" [level=1] [ref=e63]
        - paragraph [ref=e64]: "Last updated: [Date to be set upon legal review]"
        - generic [ref=e65]:
          - heading "1. Introduction" [level=2] [ref=e66]
          - generic [ref=e67]:
            - paragraph [ref=e68]: Developer312 ("we," "us," or "our") operates the Eco-Auditor platform, a carbon accounting and emissions management service. This Privacy Policy describes how we collect, use, disclose, and protect information when you use our service.
            - paragraph [ref=e69]: By accessing or using Eco-Auditor, you agree to the collection and use of information in accordance with this policy. If you do not agree with the terms of this policy, please do not access the service.
            - paragraph [ref=e70]: This policy applies to all users of Eco-Auditor, including account holders, team members invited by account holders, and visitors to our website.
        - generic [ref=e71]:
          - heading "2. Who We Are" [level=2] [ref=e72]
          - generic [ref=e73]:
            - paragraph [ref=e74]: Developer312 is a subsidiary of NIGHT LITE USA LLC. We provide the Eco-Auditor platform from the United States.
            - paragraph [ref=e75]: "Contact information:"

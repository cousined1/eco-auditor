                - link "(510) 401-1225" [ref=e238] [cursor=pointer]:
                  - /url: tel:+15104011225
            - paragraph [ref=e239]: We will verify your identity before processing your request and respond within the timeframe required by applicable law, typically within 30 days. If more time is needed, we will notify you of the reason and the expected timeline.
        - generic [ref=e240]:
          - heading "15. Cookies and Tracking Technologies" [level=2] [ref=e241]
          - generic [ref=e242]:
            - paragraph [ref=e243]: "We use cookies and similar tracking technologies to operate our service, maintain session state, and analyze usage patterns. Categories of cookies we use include:"
            - list [ref=e244]:
              - listitem [ref=e245]:

        - generic [ref=e81]:
          - heading "3. Information We Collect" [level=2] [ref=e82]
          - paragraph [ref=e84]: "We collect information in several categories to provide and improve our service:"
        - generic [ref=e85]:
          - heading "4. Information You Provide Directly" [level=2] [ref=e86]
          - generic [ref=e87]:
            - paragraph [ref=e88]: "When you create an account or use our service, you may provide:"
            - list [ref=e89]:
              - listitem [ref=e90]:
                - strong [ref=e91]: "Account details:"
                - text: Name, email address, password, company name, and role
              - listitem [ref=e92]:
                - strong [ref=e93]: "Company information:"
                - text: Organization name, industry, facility locations, and operational details
              - listitem [ref=e94]:
                - strong [ref=e95]: "Billing and contact information:"
                - text: Payment details, billing address, and designated billing contacts
              - listitem [ref=e96]:
                - strong [ref=e97]: "Support communications:"
                - text: Messages, attachments, and correspondence submitted through our support channels
              - listitem [ref=e98]:
                - strong [ref=e99]: "Uploaded documents and data:"
                - text: Utility bills, invoices, freight records, supplier spreadsheets, and other files you upload for emissions processing
              - listitem [ref=e100]:
                - strong [ref=e101]: "Configuration choices:"
                - text: Organizational boundaries, emission factors, methodology selections, and reporting preferences
            - paragraph [ref=e102]: We process this information to deliver the service you requested, maintain your account, and communicate with you about our platform.
        - generic [ref=e103]:
          - heading "5. Information Collected Automatically" [level=2] [ref=e104]
          - generic [ref=e105]:
            - paragraph [ref=e106]: "When you interact with our service, we may automatically collect:"
            - list [ref=e107]:
              - listitem [ref=e108]:
                - strong [ref=e109]: "Usage and log data:"
                - text: Pages visited, features used, click patterns, session duration, and interaction timestamps
              - listitem [ref=e110]:
                - strong [ref=e111]: "Device and connection data:"
                - text: Browser type, operating system, IP address, screen resolution, and referring URL
              - listitem [ref=e112]:
                - strong [ref=e113]: "Performance data:"
                - text: Load times, error reports, and system performance metrics
            - paragraph [ref=e114]: We collect this information to ensure platform stability, diagnose issues, and improve user experience. We do not sell this data.
        - generic [ref=e115]:
          - heading "6. Information from Integrations and Third Parties" [level=2] [ref=e116]
          - generic [ref=e117]:
            - paragraph [ref=e118]: "When you connect third-party services to Eco-Auditor, we may receive:"
            - list [ref=e119]:
              - listitem [ref=e120]: Data from accounting integrations (e.g., QuickBooks, Xero) such as transaction records relevant to emissions calculations
              - listitem [ref=e121]: Data from shipping and logistics providers (e.g., UPS, FedEx) such as shipment records for freight emission estimates
              - listitem [ref=e122]: Data from cloud service providers for Scope 3 ICT emission calculations
            - paragraph [ref=e123]: We only access data you explicitly authorize through these integrations, and we process it solely for the purpose of generating emissions estimates within your account.
        - generic [ref=e124]:
          - heading "7. How We Use Information" [level=2] [ref=e125]
          - generic [ref=e126]:
            - paragraph [ref=e127]: "We use the information we collect to:"
            - list [ref=e128]:
              - listitem [ref=e129]: Provide, operate, and maintain the Eco-Auditor platform
              - listitem [ref=e130]: Process and organize uploaded documents and data into emissions records, estimates, and reports
              - listitem [ref=e131]: Operate AI-assisted features such as the Carbon Assistant for methodology guidance and classification suggestions
              - listitem [ref=e132]: Communicate with you about your account, billing, support requests, and product updates
              - listitem [ref=e133]: Improve our service, develop new features, and conduct internal analytics
              - listitem [ref=e134]: Detect, prevent, and address technical issues, security threats, and fraud
              - listitem [ref=e135]: Comply with applicable legal obligations
            - paragraph [ref=e136]: "Where we process personal data of individuals in the European Economic Area or the United Kingdom, we rely on the following legal bases:"
            - list [ref=e137]:
              - listitem [ref=e138]:
                - strong [ref=e139]: "Contract performance:"
                - text: Processing necessary to deliver the service you subscribed to
              - listitem [ref=e140]:
                - strong [ref=e141]: "Legitimate interests:"
                - text: Improving our service, preventing fraud, and ensuring security, where those interests are not overridden by your rights
              - listitem [ref=e142]:
                - strong [ref=e143]: "Consent:"
                - text: Where you have provided explicit consent for specific processing activities, such as optional marketing communications
              - listitem [ref=e144]:
                - strong [ref=e145]: "Legal obligation:"
                - text: Processing required to comply with applicable law
        - generic [ref=e146]:
          - heading "8. How We Share Information" [level=2] [ref=e147]
          - generic [ref=e148]:
            - paragraph [ref=e149]: "We do not sell your personal data. We may share information in the following circumstances:"
            - heading "Service Providers and Subprocessors" [level=4] [ref=e150]
            - paragraph [ref=e151]: "We engage third-party service providers who process data on our behalf to deliver our service. These providers are contractually obligated to process data only as instructed and to maintain appropriate security measures. Categories include:"
            - list [ref=e152]:
              - listitem [ref=e153]:
                - strong [ref=e154]: "Cloud hosting:"
                - text: Infrastructure providers that host our application and data
              - listitem [ref=e155]:
                - strong [ref=e156]: "Payments and billing:"
                - text: Payment processors such as Stripe, Inc. to handle subscription billing
              - listitem [ref=e157]:
                - strong [ref=e158]: "Analytics:"
                - text: Service-level monitoring and aggregated usage analytics
              - listitem [ref=e159]:
                - strong [ref=e160]: "Communications:"
                - text: Email delivery and notification services
              - listitem [ref=e161]:
                - strong [ref=e162]: "Support:"
                - text: Customer support platforms that process support communications
            - paragraph [ref=e163]: Our current subprocessor list is available upon request. We will notify customers of material changes to our subprocessors.
            - heading "Compliance and Legal Requirements" [level=4] [ref=e164]
            - paragraph [ref=e165]: We may disclose information when required by law, regulation, legal process, or governmental request, or when we believe in good faith that disclosure is necessary to protect our rights, your safety, or the safety of others.
        - generic [ref=e166]:
          - heading "9. Data Retention" [level=2] [ref=e167]
          - generic [ref=e168]:
            - paragraph [ref=e169]: "We retain your information for as long as your account is active or as needed to provide our services. After account termination:"
            - list [ref=e170]:
              - listitem [ref=e171]: Account and billing data is retained for up to 90 days to allow reactivation and export
              - listitem [ref=e172]: Emissions records, reports, and audit trails are retained for the period specified in your subscription agreement, after which they are securely deleted unless you request earlier deletion
              - listitem [ref=e173]: We may retain anonymized, aggregated usage data indefinitely for service improvement
              - listitem [ref=e174]: Some data may be retained longer where required by law or for legitimate business purposes such as fraud prevention
        - generic [ref=e175]:
          - heading "10. Data Security" [level=2] [ref=e176]
          - generic [ref=e177]:
            - paragraph [ref=e178]: "We implement appropriate technical and organizational measures to protect your information, including:"
            - list [ref=e179]:
              - listitem [ref=e180]: Encryption of data in transit using TLS 1.2+
              - listitem [ref=e181]: Encryption of data at rest
              - listitem [ref=e182]: Role-based access controls and least-privilege principles
              - listitem [ref=e183]: Regular security assessments and vulnerability management
              - listitem [ref=e184]: Incident response procedures
              - listitem [ref=e185]: Employee confidentiality obligations
            - paragraph [ref=e186]: While we strive to protect your information, no method of transmission over the internet or electronic storage is completely secure. We cannot guarantee absolute security.
        - generic [ref=e187]:
          - heading "11. International Data Handling" [level=2] [ref=e188]
          - generic [ref=e189]:
            - paragraph [ref=e190]: Eco-Auditor is operated from the United States. If you are accessing our service from the European Economic Area, the United Kingdom, or other regions with data protection laws, please be aware that your information may be transferred to and processed in the United States.
            - paragraph [ref=e191]: Where required, we implement appropriate safeguards for international transfers, including Standard Contractual Clauses where applicable. EU-facing customers can request a Data Processing Addendum from our legal page.
        - generic [ref=e192]:
          - heading "12. Your Privacy Choices and Rights" [level=2] [ref=e193]
          - generic [ref=e194]:
            - paragraph [ref=e195]: "Depending on your jurisdiction, you may have the following rights regarding your personal data:"
            - list [ref=e196]:
              - listitem [ref=e197]:
                - strong [ref=e198]: "Access:"
                - text: Request a copy of the personal data we hold about you
              - listitem [ref=e199]:
                - strong [ref=e200]: "Correction:"
                - text: Request correction of inaccurate or incomplete personal data
              - listitem [ref=e201]:
                - strong [ref=e202]: "Deletion:"
                - text: Request deletion of your personal data, subject to lawful retention requirements
              - listitem [ref=e203]:
                - strong [ref=e204]: "Portability:"
                - text: Request transfer of your data in a structured, commonly used format
              - listitem [ref=e205]:
                - strong [ref=e206]: "Restriction:"
                - text: Request restriction of processing in certain circumstances
              - listitem [ref=e207]:
                - strong [ref=e208]: "Objection:"
                - text: Object to processing based on legitimate interests or for direct marketing
              - listitem [ref=e209]:
                - strong [ref=e210]: "Withdrawal of consent:"
                - text: Withdraw consent you have previously provided, without affecting the lawfulness of processing based on consent before its withdrawal
            - paragraph [ref=e211]: To exercise any of these rights, please contact us using the information in the Contact section below. We will respond within the timeframe required by applicable law.
        - generic [ref=e212]:
          - heading "13. California Privacy Rights" [level=2] [ref=e213]
          - generic [ref=e214]:
            - paragraph [ref=e215]: "If you are a California resident, you have additional rights under the California Consumer Privacy Act (CCPA) as amended by the CPRA:"
            - list [ref=e216]:
              - listitem [ref=e217]:
                - strong [ref=e218]: "Right to know:"
                - text: You can request information about the categories of personal information we have collected, the purposes, and the categories of third parties with whom we share it
              - listitem [ref=e219]:
                - strong [ref=e220]: "Right to delete:"
                - text: You can request deletion of personal information we have collected, subject to certain exceptions
              - listitem [ref=e221]:
                - strong [ref=e222]: "Right to correct:"
                - text: You can request correction of inaccurate personal information
              - listitem [ref=e223]:
                - strong [ref=e224]: "Right to opt out of sale or sharing:"
                - text: We do not sell or share personal information for cross-context behavioral advertising purposes
              - listitem [ref=e225]:
                - strong [ref=e226]: "Right to limit use of sensitive personal information:"
                - text: We do not collect or use sensitive personal information beyond what is necessary to provide our service
            - paragraph [ref=e227]: We are not a data broker and do not sell personal information. Our service is directed at businesses, and the personal information we process is primarily business-related rather than consumer-oriented.
            - paragraph [ref=e228]: Authorized agents may submit requests on your behalf, subject to verification.
        - generic [ref=e229]:
          - heading "14. How to Submit a Privacy Request" [level=2] [ref=e230]
          - generic [ref=e231]:
            - paragraph [ref=e232]: "To submit a privacy request, exercise your rights, or ask questions about this policy, you may contact us through:"

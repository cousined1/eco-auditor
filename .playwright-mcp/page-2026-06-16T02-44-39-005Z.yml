              - listitem [ref=e249]:
                - strong [ref=e250]: "Preference cookies:"
                - text: Remember your settings such as theme preferences
            - paragraph [ref=e251]: We do not use cookies for cross-site tracking or targeted advertising. You can manage cookie preferences through your browser settings. Disabling essential cookies may affect service functionality.
        - generic [ref=e252]:
          - heading "16. Children's Privacy" [level=2] [ref=e253]
          - paragraph [ref=e255]: Our service is intended for business use and is not directed at individuals under the age of 16. We do not knowingly collect personal information from children. If we learn that we have collected personal data from a child under 16, we will take steps to delete it promptly. If you believe we have inadvertently collected such information, please contact us.
        - generic [ref=e256]:
          - heading "17. Changes to This Policy" [level=2] [ref=e257]
